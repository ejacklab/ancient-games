# Engine calls the guard recognises (SPEC.md M1). Generic: command shapes only, no paths.
engines:
  - name: codex
    command: '\bcodex\b(?:\s+--?[\w-]+(?:[ =][^\s]+)?)*\s+exec\b'
    output_flags: ["-o", "--output-last-message"]
    stdout_is_answer: false
  - name: opencode
    command: '\bopencode\s+run\b'
    stdout_is_answer: true
  - name: agy
    command: '\bagy\b[^|;&]*\s-p\b'
    stdout_is_answer: true
    silent_failures:
      - { text: "print timeout", status: "timeout" }
      - { text: "auto-denied", status: "denied" }
  - name: dsh
    command: '\bdsh\s+headless\b'
    stdout_is_answer: true
  - name: qwen
    command: '\bqwen\b[^|;&]*\s-p\b'
    stdout_is_answer: true
  - name: claude
    command: '\bclaude\s+(?:[^|;&]*\s)?-p\b'
    stdout_is_answer: true
  - name: four-experts
    command: '\bfour_experts\.py\s+run\b'
    output_flags: ["--out"]
    stdout_is_answer: false
    status_from_out_dir: true
