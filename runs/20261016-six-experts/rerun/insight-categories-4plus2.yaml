# Linus's scheme (runs/20261016-six-experts/experts-q1q2-opencode/answers/linus.md, steps 3-6): the four Source kinds as
# categories, and two flags that stack on any of them.
categories:
  - id: instruction
    name: "an instruction — a spec, brief, question, or the agent's own way of working"
    sources: [instruction]
  - id: check
    name: "a check — a test or an automated check misfired or missed"
    sources: [check]
  - id: tool
    name: "a tool — an engine, CLI or library behaved other than expected"
    sources: [tool]
  - id: config
    name: "settings, sandbox, quota, install"
    sources: [config]
  - id: engine
    name: "the failing actor is an AI engine CLI or provider, or its quota"
    flag: true
    engines: true
  - id: engine
    name: "the same, when the journal has no record: named in the heading"
    flag: true
    titles: ["codex", "opencode", "claude -p", "\\bagy\\b", "\\bdsh\\b", "mcode", "engine", "quota", "usage limit", "minimax", "gemini", "deepseek"]
  - id: unconfirmed
    name: "the root cause is not proven"
    flag: true
    rootCause: ["not confirmed", "unconfirmed", "not established", "from an earlier run"]
