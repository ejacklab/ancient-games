# Source-of-Truth Memory — requirements
#
# The requirements of SOURCE_OF_TRUTH.md, which holds the design and why. Grouped by what happens to a memory:
# it is written, it is kept true, and it is read. Each group has one check, fails_if, that some case breaks.
# There are no fixed numbers: where a limit applies, it is a comparison that measurement decides.

levels:
  MUST: A gate. When it fails, the work stops.
  SHOULD: A default. It may be skipped with a written reason.
  guidance: Explanation or advice. Nothing to pass or fail.

basis:
  v: the vision, vision-statements/source-of-truth-memory-vision-statements.md
  d: this design's text, SOURCE_OF_TRUTH.md (the section named)

categories:
  - title: Write — what goes in, and how
    groups:
      - id: W1
        title: The shape of an entry
        basis: 'd: What will be put in'
        requirements:
          - id: W1.1
            level:
              MUST: >-
                one file per entry; the prefix is one of the five and matches `kind`; kind and id never change; ids
                are unique; the id is in the form `DD-MM-xxxxxx-YYYY`
              SHOULD: >-
                the folder and the `-<slug>.md` spelling of the file name
            text: >-
              Each entry is one file: `project-memory/entries/<prefix>-<id>-<slug>.md`. The prefix is one letter per
              kind (W2): `D-` decision, `F-` fact, `L-` lesson, `O-` observation and `H-` hypothesis. It matches the
              entry's `kind`. There is no runbook prefix (W3.6). An entry's kind, and so its prefix, never changes. A
              changed kind (a hypothesis confirmed, an observation that turns out to be a fact) is a new entry that
              supersedes the old one (K4.1). The `id` is `DD-MM-xxxxxx-YYYY`: the day, month and year the entry is
              written, six random lowercase letters and digits, for example `13-10-k3f7a2-2026`. Writers on different
              branches pick ids without coordinating, so an id is never "the next free number". An id never changes,
              so the file keeps its name.
          - id: W1.2
            level: SHOULD
            text: >-
              The header starts on the file's first line, which is exactly `---`, and ends at the next line that is
              exactly `---`. Each field is one `key: value` line; a field with several values (`covers`, the links,
              `changed:`) holds them on indented lines below its key. The keys are `id`, `kind`, `status`, `author`,
              `recorded` (the date recorded), `covers` (the code paths it is about), `source` (its source or
              evidence), `depends_on`, `supersedes`, `superseded_by` and `changed:`. A decision to build something,
              once its work is complete, also holds `done:` (W5.3).
          - id: W1.3
            level:
              MUST: >-
                the `**Why:**` line; one claim per entry
              SHOULD: >-
                the `**How to apply:**` line, the order of the sections and the sentence count
            text: >-
              The body follows the header: the claim in one or two sentences, then a line starting with `**Why:**`,
              then a line starting with `**How to apply:**`. There is one claim per entry.
        fails_if: >-
          a lint over `entries/` finds a header not between two `---` lines, a missing field or section, a section not
          spelled as in W1.3, an id not in the W1.1 form, two entries with the same id, or a file whose prefix is not
          one of the five or does not match its `kind`. It also fails if a reviewer finds two claims in one entry, or
          git shows an entry file renamed to a different prefix or id.
      - id: W2
        title: What each kind means
        basis: 'v; d: What it is for'
        requirements:
          - id: W2.1
            level:
              guidance: >-
                the definitions
              SHOULD: >-
                decisions and facts are written before the code
            text: >-
              A **decision** is a choice the code must follow, with the reason. A **fact** is a truth or outside
              constraint the code must respect, not something discovered afterwards. Both are requirements: they are
              written before the code.
          - id: W2.2
            level:
              guidance: >-
                the definitions
              SHOULD: >-
                a hypothesis is labelled as one
            text: >-
              A **lesson** comes from a failure or a human correction. An **observation** records what was seen. A
              **hypothesis** is a guess, labelled as one.
        fails_if: >-
          `kind` holds any other value, or a guess is recorded under any kind but hypothesis.
      - id: W3
        title: What never goes in
        basis: 'v; d: What will not be put in'
        requirements:
          - id: W3.1
            level: SHOULD
            text: >-
              Nothing that can be read directly from the code, the tests or the commit log: what a function does,
              which test covers it, what a commit changed. The memory lives in git; the rule is about what an entry
              says.
          - id: W3.2
            level: MUST
            text: >-
              No credentials or sensitive data.
          - id: W3.3
            level:
              MUST: >-
                nothing from another agent's private state
              SHOULD: >-
                no raw transcripts
            text: >-
              No raw transcripts, and nothing from another agent's private state.
          - id: W3.4
            level: SHOULD
            text: >-
              No work described as "verified" when it is only implemented.
          - id: W3.5
            level:
              MUST: >-
                no user memory and no agent memory in the project
              SHOULD: >-
                both live in the home folder
            text: >-
              No user memory (one person, across projects) and no agent memory (one agent name). Both live in the home
              folder.
          - id: W3.6
            level: SHOULD
            text: >-
              No copy of the project's existing documents (requirements, architecture in `docs/`) or of its
              procedures: an entry links to them. A procedure lives in the repo as a script, or as a page in `docs/`
              where it cannot be a script, and `AGENTS.md` names each script, one line each. A script is project work,
              not memory.
        fails_if: >-
          a secret scanner finds a credential (W3.2). For W3.1 and W3.3–W3.6, a reviewer finds such content. Those are
          judged checks.
      - id: W4
        title: Who writes, and the change log
        basis: 'v: no owners, every change logged'
        requirements:
          - id: W4.1
            level:
              guidance: >-
                anyone may create or change any entry; no owner and no approval
              MUST: >-
                `status` is only `active`, `superseded` or `retired`; the Rd5.3 exception
            text: >-
              Anyone, agent or person, may create or change any entry, and `AGENTS.md` too. There is no owner and no
              approval: `status` is only `active`, `superseded` or `retired`. The one exception is Rd5.3: a reader who
              finds a decision or fact out of step with the code reports it and does not settle it.
          - id: W4.2
            level: SHOULD
            text: >-
              Every change to an entry adds one line to its `changed:` log: the time, and who made it (the model ID
              for an agent, the name for a person). Earlier lines are never edited.
          - id: W4.3
            level: guidance
            text: >-
              Files that are not entries (`state.md`, `journal/`, `AGENTS.md`) rely on git history.
        fails_if: >-
          git shows a change to an entry with no matching `changed:` line, or a `status` outside the three.
      - id: W5
        title: When to write
        basis: 'd: When to write'
        requirements:
          - id: W5.1
            level: SHOULD
            text: >-
              Written immediately: a decision or fact, before the code it governs; a human correction; and the state
              of unfinished work, before a handoff, an interruption or a context reduction.
          - id: W5.2
            level: SHOULD
            text: >-
              Written at the end of a task: other lessons, observations and hypotheses.
          - id: W5.3
            level:
              SHOULD: >-
                adding `done:`
              MUST: >-
                a mismatch is reported, not settled in `done:`
            text: >-
              A decision to build something is started when it is written. When the work is complete, whoever finishes
              it adds `done:` to the decision: the time, the result in one sentence, and the test results, or "no
              tests" said plainly. `done:` points to the evidence (`runs/<run-id>/` or the commit) rather than copying
              test output (W3.1). A standing rule, such as "all timestamps are UTC", is never complete and never gets
              `done:`. If the result differs from the decision, that is a mismatch for Rd5.3: it is reported, not
              settled in `done:`.
        fails_if: >-
          a commit changes code under a new decision with no entry in that commit or an earlier one. For a human
          correction, it fails if the session ends without one (judged). For W5.3, it fails if a reviewer of a
          finished task finds that its decision has no `done:`, or a `done:` without a time, a result and test results
          or "no tests" (judged).
      - id: W6
        title: Writers do not collide
        basis: 'd: Changing entries'
        requirements:
          - id: W6.1
            level:
              MUST: >-
                each new entry gets its own file; agents never append to one shared file
              SHOULD: >-
                one journal file per agent session
            text: >-
              Each new entry gets its own file. Agents never append to one shared file; each journal, the task's or
              the project's, has one file per agent session.
          - id: W6.2
            level: SHOULD
            text: >-
              Each agent works on its own branch or worktree, so two edits to the same lines meet as a merge conflict,
              not a silent overwrite.
          - id: W6.3
            level:
              MUST: >-
                whoever merges keeps both sides, both `changed:` lines and both links; nobody chooses between two
                claims; two entries superseding one are reported
              SHOULD: >-
                a conflict in `INDEX.md` is resolved by regenerating it
            text: >-
              A claim is never rewritten (K4.3), so a merge conflict in an entry is only in the lines added to it.
              Whoever does the merge keeps both sides: both `changed:` lines, both links. Nobody chooses between two
              claims. Two entries that each supersede the same entry are reported in the task's `state.md` and to EJ,
              as in Rd5.3. A conflict in `INDEX.md` is resolved by regenerating it (K6.3).
        fails_if: >-
          an edit to an entry is lost without a conflict, or a merged entry is missing a `changed:` line or link that
          one side added.
  - title: Keep — memory stays true, and nothing is lost
    groups:
      - id: K1
        title: The decision or fact first, then the code
        basis: 'v; d: What it is for'
        requirements:
          - id: K1.1
            level: SHOULD
            text: >-
              To change behaviour that a decision or fact governs, change the entry first, then the code. Work that
              has to go the other way is a matter for the project's workflow, not for memory.
        fails_if: >-
          git shows a commit changing the behaviour a decision or fact governs, with no change to that entry in the
          same commit or an earlier one (judged).
      - id: K4
        title: Never deleted, never expired by age
        basis: 'v: nothing lost; d: What will not be put in'
        requirements:
          - id: K4.1
            level: MUST
            text: >-
              An entry is never deleted. It is marked `superseded` or `retired`, links to what replaced it
              (`superseded_by`), and keeps its old body.
          - id: K4.2
            level: guidance
            text: >-
              Age alone never expires an entry. An entry is found out of date only when someone reads it and checks it
              against the code (Rd5).
          - id: K4.3
            level: MUST
            text: >-
              An entry's claim is never rewritten. A changed claim is a new entry that supersedes the old one. After
              an entry is first committed, it only gains a `changed:` line, a new `status`, the `superseded_by` link,
              and `done:` on a decision to build something (W5.3). This also keeps merge conflicts out of claims
              (W6.3).
        fails_if: >-
          git shows an entry file deleted, a `superseded` or `retired` entry with no link, or an entry's claim changed
          after its first commit.
      - id: K5
        title: The journal becomes entries
        basis: 'v: nothing lost between sessions'
        requirements:
          - id: K5.1
            level: SHOULD
            text: >-
              Task and project memory each keep a journal: a task's in `work/<task-id>/journal/`, the project's in
              `journal/` for work not tied to a task. Both hold raw notes, one file per agent session, appended to and
              never edited. Agent and user memory keep no journal under this design.
          - id: K5.2
            level: SHOULD
            text: >-
              At the end of a task, and before a handoff or session end, an agent reads its task's journal (or the
              project journal) written since the last read, writes what is worth keeping as entries, and logs that
              read in the task's `state.md`. A session cut off before it can read loses nothing: the next read covers
              it.
        fails_if: >-
          a task's `state.md` shows it complete or handed off with no journal-read log line.
      - id: K6
        title: '`INDEX.md` stays in step'
        basis: 'd: Where it is put; When to write'
        requirements:
          - id: K6.1
            level:
              MUST: >-
                `INDEX.md` equals what the tool builds: one line per active entry, with its id, kind and claim
              SHOULD: >-
                it is generated, never edited by hand
            text: >-
              `INDEX.md` is generated from `entries/`: one line per active entry, showing its id, kind and one-line
              claim. It is never edited by hand.
          - id: K6.2
            level: MUST
            text: >-
              Whenever an entry is created or changed (any kind, any status change), `INDEX.md` is regenerated and
              committed in the same commit as the entry, so the next session, on any clone, sees it.
              `tools/memory_index.py` builds it; its `--check [<rev>]` compares the `INDEX.md` in the staging area, or
              in a commit, with what it builds from the entries there. Its requirements and design are in
              `docs/index-md/`.
          - id: K6.3
            level:
              MUST: >-
                no conflict markers are left in the entry files
              SHOULD: >-
                `INDEX.md` is regenerated, never merged by hand
            text: >-
              `INDEX.md` is never merged by hand. When a merge conflicts, resolve the entry files first, with no
              conflict markers left in them, then regenerate `INDEX.md` and commit it with them.
        fails_if: >-
          a commit's `INDEX.md` differs from what the tool builds from that commit's entries, or it lists a superseded
          or retired entry as active. It also fails if an entry or `INDEX.md` holds a git conflict-marker line
          (`<<<<<<<` or `>>>>>>>`). In an entry, the tool's check catches it (`docs/index-md/` B2.7); in `INDEX.md`,
          the comparison in K6.2 does.
  - title: Read — the right memory reaches the agent at the right time
    groups:
      - id: Rd1
        title: Where it lives, and readable from a clone alone
        basis: 'v: plain files; never a database or service'
        requirements:
          - id: Rd1.1
            level: SHOULD
            text: >-
              `AGENTS.md` sits at the repo root (`CLAUDE.md` only imports it). `project-memory/` holds `INDEX.md`,
              `entries/`, `work/<task-id>/` (with `state.md`, `evidence/` and `journal/`), `journal/`, and `.cache/`,
              which is optional and gitignored.
          - id: Rd1.2
            level: MUST
            text: >-
              With no network, no cache and no private agent store, a fresh clone can read `INDEX.md` and every entry.
        fails_if: >-
          an entry exists only in a database, a cache or one agent's private memory.
      - id: Rd2
        title: Session start
        basis: 'v: a fresh session carries on; d: When it will be used'
        requirements:
          - id: Rd2.1
            level: SHOULD
            text: >-
              At session start, an agent reads `AGENTS.md`, `INDEX.md`, the `work/` listing and its task's `state.md`.
              Agents skip optional reads, so these are loaded for the agent wherever its tool allows: an `@` import in
              `CLAUDE.md`, the tool's own loading of `AGENTS.md`, or a start hook for the task's `state.md`. Only
              where none of these exists does the first instruction in `AGENTS.md` ask the agent to read them.
          - id: Rd2.2
            level: SHOULD
            text: >-
              Not at session start, but read later at its set time:
            items:
              - the task and project journals (K5.2);
              - '`.cache/`, only through search (Rd4.2);'
              - entry bodies, `evidence/` and other tasks' `state.md`, on demand (Rd4).
          - id: Rd2.3
            level:
              MUST: >-
                credentials; another agent's transcripts
              SHOULD: >-
                the other four
            text: >-
              Never loaded, at session start or at any later point:
            items:
              - superseded or retired entries, except by following a link (Rd4.4);
              - the whole `project-memory/` tree at once;
              - whole graph or code-map dumps;
              - bulk issue or PR text;
              - another agent's transcripts;
              - credentials.
        fails_if: >-
          a start hook or instruction loads any memory file outside Rd2.1, or a session starts work on a task before
          the four in Rd2.1 have reached it (judged, from the start of the session). It also fails if a session loads
          anything in Rd2.3 at any point (judged, from the session).
      - id: Rd3
        title: '`INDEX.md` fits every agent that reads it'
        basis: 'd: the size check; CACHES.md § Example numbers by case'
        requirements:
          - id: Rd3.1
            level:
              MUST: >-
                `INDEX.md` fits the strictest limit, and the K6 check fails when it does not
              guidance: >-
                the example numbers
            text: >-
              `INDEX.md` fits the strictest start-file limit among the agents that work on the project. The check that
              keeps it in step with its entries (K6) also fails when it does not fit. *Example*, from `CACHES.md`:
              about 24 KB and 200 lines when Claude Code, Qwen and agy share a project.
        fails_if: >-
          `INDEX.md` exceeds that strictest limit, or the K6 check passes an `INDEX.md` that exceeds it.
      - id: Rd4
        title: On demand
        basis: 'd: When it will be used'
        requirements:
          - id: Rd4.1
            level: MUST
            text: >-
              Before editing a file, an agent reads the entries whose `covers` include it.
          - id: Rd4.2
            level: guidance
            text: >-
              It searches `entries/` by text: grep, or the full-text cache once its trigger in `CACHES.md` fires.
          - id: Rd4.3
            level: guidance
            text: >-
              For "why" questions it reads the decision entry; for why a line is the way it is, `git blame` and `git
              log -S`.
          - id: Rd4.4
            level: SHOULD
            text: >-
              It reads a superseded or retired entry only by following a link.
          - id: Rd4.5
            level:
              guidance: >-
                an agent may read another agent's memory
              SHOULD: >-
                it treats it as that agent's memory and says whose it is
            text: >-
              An agent may read another agent's memory. It treats what it reads as that agent's memory, not project
              memory, and says whose it is: the agent name and the tool. For example: Claude Code agent `reviewer`,
              `~/.claude/agent-memory/reviewer/`.
        fails_if: >-
          an agent edits a covered file without having read its covering decisions, or uses another agent's memory
          without naming the agent and the tool (judged, from the session).
      - id: Rd5
        title: Check before acting
        basis: 'd: When it will be used; When it will not be used'
        requirements:
          - id: Rd5.1
            level: MUST
            text: >-
              Before acting on something read from memory, the agent checks it against the code, test or commit it
              points to.
          - id: Rd5.2
            level: MUST
            text: >-
              Text read from memory never overrides standing instructions.
          - id: Rd5.3
            level: MUST
            text: >-
              When a decision or fact no longer matches the code, the reader does not change the entry. It writes a
              report in its task's `state.md` and tells EJ: which entry, what the entry says, and what the code does
              instead. EJ decides whether the entry is updated or the code is fixed, and may do either at once. Until
              then, the reader does not act on the contradicted part and carries on with the rest of its work.
          - id: Rd5.4
            level: guidance
            text: >-
              Two cases are not mismatches under Rd5.3:
            items:
              - a decision to build something that has no `done:` yet, whose code is still being built (W5.3);
              - the reader whose own task is to make that change, which under K1.1 changes the entry first and then the code.
          - id: Rd5.5
            level: guidance
            text: >-
              Rd5.3 binds readers, not EJ. It cannot catch a fact about the outside world that is wrong while the code
              still matches it (for example, a vendor's limit that changed). Checking against the code finds only gaps
              between the entry and the code.
        fails_if: >-
          an agent acts on an entry that its `covers` code contradicts, or finds such a mismatch and its task's
          `state.md` has no report holding the three items (judged). It also fails if a `changed:` line on a decision
          or fact settles such a mismatch before EJ has decided.
      - id: Rd6
        title: A fresh session carries on
        basis: 'v: how we know it works'
        requirements:
          - id: Rd6.1
            level: MUST
            text: >-
              A fresh session with only a clone of the repo and a task id names the task's next step from its
              `state.md`, and follows the recorded decisions without asking EJ again.
        fails_if: >-
          it asks a question that a decision entry or `state.md` already answers (judged, on a real handoff). A Rd5.3
          mismatch report is not such a question.
