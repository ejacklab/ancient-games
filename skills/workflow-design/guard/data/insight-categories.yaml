# The four insight categories: an insight's own Source kind (the whys end at an instruction, a check, a tool or a
# config). Decided by EJ after a comparison in run 20261016-six-experts (rerun/compare.md): Linus's four Source kinds
# did as well as six categories guessed from titles, and are placed with nothing guessed.
categories:
  - id: instruction
    name: "an instruction — a spec, brief, question, or the agent's own way of working"
    sources: [instruction]
  - id: check
    name: "a check — a test or an automated check misfired or missed"
    sources: [check]
  - id: tool
    name: "a tool — an engine, CLI or library behaved other than expected"
    sources: [tool]
  - id: config
    name: "settings, sandbox, quota, install — the environment a run depends on"
    sources: [config]
