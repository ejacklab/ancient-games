# The six insight categories (run 20261016-six-experts, provisional decision D1: the experts' advice — 范蠡, 孫子 split
# the Source kinds; Linus and 老子 dissent, see the run's compare.md). A section takes the first rule that matches; a
# section's own `Category: <id>` line overrides every rule. Titles are matched here only to place a section; the index
# never prints them.
categories:
  - id: config
    name: "settings, sandbox, quota, install — the environment a run depends on"
    sources: [config]
  - id: tool
    name: "an engine, CLI or library behaved other than expected"
    sources: [tool]
  - id: test
    name: "a test or test suite failed, was weak, or was read wrongly"
    sources: [check]
    titles: ["test", "suite", "pytest", "bun test", "mutant", "assert"]
  - id: guard-check
    name: "an automated check misfired (a false alarm) or missed a failure"
    sources: [check]
  - id: spec
    name: "a spec, brief, question or requirement given to another worker was unclear or wrong"
    sources: [instruction]
    titles: ["spec", "brief", "question", "prompt", "requirement", "wording", "paraphrase", "literal", "R1[0-9]", "rule"]
  - id: own-work
    name: "the agent's own way of working — command shape, typed values, order of steps"
    sources: [instruction]
